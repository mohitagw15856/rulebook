<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="rulebook logo">
  <defs>
    <linearGradient id="lfelt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5138"/>
      <stop offset="1" stop-color="#072a20"/>
    </linearGradient>
    <linearGradient id="lgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#e8b93f"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#lfelt)"/>
  <rect x="10" y="10" width="236" height="236" rx="44" fill="none" stroke="#e8b93f" stroke-opacity="0.35" stroke-width="3"/>

  <!-- a rulebook that is also a card -->
  <g transform="translate(128 132)">
    <rect x="-72" y="-82" width="132" height="164" rx="14" fill="#0a3427" stroke="#e8b93f" stroke-opacity="0.4" stroke-width="2" transform="rotate(-9)"/>
    <rect x="-64" y="-80" width="132" height="164" rx="14" fill="#fffdf7" stroke="#d9d2c2" stroke-width="2"/>
    <!-- page lines -->
    <g stroke="#c9c2b2" stroke-width="4" stroke-linecap="round">
      <path d="M-42 -34 H30"/>
      <path d="M-42 -10 H38"/>
      <path d="M-42 14 H22"/>
    </g>
    <text x="-46" y="-52" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#c02b2b">A</text>
    <text x="2" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#c02b2b">♥</text>
  </g>

  <!-- the verdict stamp -->
  <g transform="translate(180 186) rotate(-14)">
    <circle cx="0" cy="0" r="40" fill="#c02b2b"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#lgold)" stroke-width="4"/>
    <path d="M-17 2 l12 13 l22 -27" fill="none" stroke="#fffdf7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
