name: Go Fish
type: card
family: matching
players:
  min: 2
  max: 6
  best: 4
playtime_box: 15m
playtime_actual: 20m
teach_time: 60s
weight: 1.0
luck: 80
components:
  - Standard 52-card deck
downtime: 40s
min_age: 4
concession: >
  Stop the moment the youngest player stops enjoying it. Nothing is lost, and a game abandoned happily is better than one finished grimly.
setup_time: 40s
teardown_time: 40s
tiebreak: >
  Most sets wins; if level, the game is drawn. Nobody minds.
objective: >
  Collect more complete sets of four matching ranks than anyone else.
setup_by_players:
  - players: "2-3"
    setup: Deal 7 each.
  - players: "4-6"
    setup: Deal 5 each.
    note: Five cards keeps enough in the pond for the game to last.
turn_structure:
  - Ask one named player for a specific rank you already hold at least one of.
  - If they have any, they hand over all of them and you take another turn.
  - If they do not, they say "go fish" and you draw one card from the pond.
  - Lay down any complete set of four as soon as you hold it.
win_condition: >
  Play ends when all thirteen sets are complete. Whoever laid down the most
  sets wins.
editions:
  - name: Memory-driven variants
    changed: >
      Some versions require you to ask for a specific card rather than a rank,
      turning it into a much harder memory game for older players.
cheats:
  - move: >
      Denying holding a card you were asked for, then playing it two 
      turns later.
    spot: >
      It is usually a child and usually not malice. Ask to see the hand 
      rather than accusing.
handicaps:
  - for: Mixed ages
    method: >
      Adults play with their hand face up on the table. Children find 
      this hilarious and it evens the memory gap completely.
lineage:
  from:
    - Authors
    - Quartets
  note: >
    A children's simplification of the Quartets family, played across 
    Europe under many names.
misplays:
  - move: >
      Asking for whatever you drew most recently.
    instead: >
      Ask for what you have three of. You only need one more, and you 
      have three chances of somebody holding it.
substitutions: >
  Works with any deck. With a partial deck, remove whole ranks rather than
  individual cards so that every set is still completable.
accessibility: >
  Rank-based rather than colour-based, so colour vision is not needed. Holding a
  large fan of cards is the main dexterity barrier — a card holder or a stand
  solves it for small hands and for anyone with limited grip.
sources:
  - https://www.pagat.com/quartet/gofish.html
verified: null
