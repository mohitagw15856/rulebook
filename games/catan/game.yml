name: Catan
type: board
family: trading-and-building
players:
  min: 3
  max: 4
  best: 4
playtime_box: 60m
playtime_actual: 90m
teach_time: 15m
weight: 2.3
luck: 50
components:
  - 19 terrain hexes and surrounding sea frame
  - 95 resource cards, 25 development cards
  - Roads, settlements and cities in four colours
  - Two dice, the robber, number tokens
downtime: 3m
min_age: 10
concession: >
  Do not concede Catan. A trailing player still controls who gets the wheat, and quitting hands the game to whoever they were blocking. If you must stop, agree to end at a lower points target instead.
setup_time: 8m
teardown_time: 6m
tiebreak: >
  Ties cannot happen. Victory points are checked only on your own turn, so 
  the first player to reach ten ends it before anyone else can match.
objective: >
  Be first to ten victory points, earned from settlements, cities, the longest
  road, the largest army and some development cards.
setup_by_players:
  - players: "2"
    setup: Not supported by the base box. The official two-player option is the Catan card game or a variant with a neutral third builder.
    note: Straight two-player Catan collapses because trading is the engine of the game and there is nobody to trade against.
  - players: "3-4"
    setup: Standard board. Each player places two settlements and two roads in a snake order, then collects resources from their second settlement.
    note: Four players is the designed count; three plays noticeably looser with more open board space.
  - players: "5-6"
    setup: Requires the 5-6 player extension, which adds hexes, pieces and a special build phase.
    note: The base box physically cannot support five without the extension.
turn_structure:
  - Roll two dice; every player with a settlement or city on a matching hex collects resources.
  - A roll of 7 moves the robber, and anyone holding more than seven cards discards half.
  - Trade with other players or with the bank.
  - Build roads, settlements, cities, or buy development cards.
win_condition: >
  Ten victory points, announced on your own turn. Development-card points are
  kept hidden until then, which is how games end unexpectedly.
editions:
  - name: 4th and 5th edition
    year: 2015
    changed: >
      The 5th edition changed the art and box, made the sea frame standard, and
      adjusted some component counts. The rules of play are essentially the
      same, so mixed-edition games work fine.
cheats:
  - move: >
      Taking two resources when one was earned, during a busy collection 
      phase.
    spot: >
      Collect one hex at a time, out loud, when the table is large. 
      Slower, and it ends the problem.
  - move: >
      Miscounting a trade — handing over two of something when three was 
      agreed.
    spot: >
      Complete trades in the middle of the table rather than hand to 
      hand.
handicaps:
  - for: A first-time player
    method: >
      Let them place last and first in the snake, and allow them to take 
      back a placement in the first two turns.
  - for: A much stronger player
    method: >
      Set their target to eleven victory points while everyone else 
      plays to ten.
substitutions: >
  Lost number tokens can be replaced by writing numbers on card. A missing
  robber can be any distinctive object. Resource cards are the one component
  that genuinely cannot be improvised at reasonable effort.
accessibility: >
  Player colours are the main barrier, and red versus green appears in every
  set — use shape markers or distinct piece sets. The number tokens are small;
  the dots beneath each number indicate probability and are frequently too small
  to read, so a printed probability reference helps.
sources:
  - https://www.catan.com/
verified: null
