name: Pablo
type: card
family: memory-and-draw
players:
  min: 2
  max: 6
  best: 4
playtime_box: 20m
playtime_actual: 35m
teach_time: 4m
weight: 1.6
luck: 65
components:
  - Standard 52-card deck with jokers
downtime: 45s
min_age: 8
concession: >
  Fine to stop after any completed round, since scores carry cleanly and a part-finished round can simply be dropped.
setup_time: 60s
teardown_time: 60s
tiebreak: >
  Lowest total wins; if two players tie, the one who did not call Pablo 
  takes it.
objective: >
  Finish with the lowest total in front of you, while remembering cards you are
  only allowed to look at twice.
setup_by_players:
  - players: "2-4"
    setup: One deck. Deal 4 face-down cards to each player in a two-by-two square.
    note: Each player may look at exactly two of their own four at the start, once.
  - players: "5-6"
    setup: Two decks shuffled together, still 4 cards each.
    note: One deck leaves too little draw pile for six players.
turn_structure:
  - Draw the top of the stock or the top of the discard pile.
  - Either swap it for one of your face-down cards, or discard it and use its power.
  - Any player may snap a matching card from their own layout onto the discard pile.
  - Call Pablo instead of drawing, if you believe you have the lowest total.
win_condition: >
  After a Pablo call, all cards are revealed. The caller wins the round only if
  their total is lowest; otherwise they take a penalty. Lowest cumulative score
  when someone passes 100 loses.
editions:
  - name: Cabo, Golf, Cambio
    changed: >
      The same game circulates under many names with small differences in card
      powers and the penalty for a failed call. Pablo, Cabo and Cambio are
      effectively the same game; four-card Golf is a close cousin without the
      card powers.
lineage:
  from:
    - Golf
    - Cabo
  note: >
    Part of the Cabo, Cambio and Golf family of low-score 
    draw-and-discard games. No version is authoritative, which is 
    exactly why its rulings are so contested.
substitutions: >
  Any deck. Without jokers, drop their power and treat Kings as the zero-value
  card, which many groups do anyway.
accessibility: >
  Relies on memory rather than speed, but the snap rule rewards quick hands and
  can exclude players with slower reaction times — it is easily dropped without
  harming the game. Card values are numeric, so colour vision is not required.
sources:
  - https://www.pagat.com/draw/golf.html#power
verified:
  on: 2026-08-16
  by: mohitagw15856
  checked:
    - the Cabo and Pablo family sits under the Golf group on pagat
    - the Pablo variant uses sevens and eights as power cards
    - calling Pablo and not being lowest is penalised
