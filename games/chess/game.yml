name: Chess
type: abstract
family: abstract-strategy
players:
  min: 2
  max: 2
  best: 2
playtime_box: 30m
playtime_actual: 45m
teach_time: 10m
weight: 3.6
luck: 0
components:
  - 8x8 board
  - 32 pieces in two colours
  - Optional clock
downtime: 1m
min_age: 7
concession: >
  Resigning is normal and, at any level of seriousness, polite. Playing on two pawns down against someone who obviously has it is a way of asking them to prove it, which is fine between friends and tiresome otherwise.
setup_time: 60s
teardown_time: 60s
tiebreak: >
  A drawn game is a genuine result, not a failure to finish. In a 
  tournament, tiebreaks run on head-to-head, then most games won with black, 
  then a blitz playoff.
objective: >
  Attack the opposing king so that no legal move escapes the attack.
setup_by_players:
  - players: "2"
    setup: "White on ranks 1 and 2, Black on 7 and 8. Queen goes on her own colour; the right-hand corner square is light for both players."
    note: Queen on her own colour is the setup error people make most often.
turn_structure:
  - White moves first; players alternate single moves with no passing.
  - Move a piece according to its movement rule, capturing by occupying.
  - You may never make a move that leaves your own king in check.
win_condition: >
  Checkmate — the king is attacked and no legal move removes the attack. Games
  also end by resignation, or in a draw by stalemate, agreement, threefold
  repetition, the fifty-move rule, or insufficient material.
editions:
  - name: FIDE laws
    changed: >
      The competitive rules are maintained by FIDE and are periodically revised,
      mostly on clock handling, illegal-move penalties and tournament conduct.
      The movement of the pieces has been stable since the fifteenth century.
cheats:
  - move: >
      Taking back a move after seeing the reply, framed as 'I hadn't let 
      go'.
    spot: >
      Touch-move is the rule and it is unambiguous. Agree at the start 
      whether you are playing it, and then play it.
  - move: >
      Nudging the clock, or hitting it before completing the move.
    spot: >
      The move ends when the clock is pressed. Anyone can call it.
handicaps:
  - for: A much stronger player
    method: >
      Remove material — a knight, then a rook, then the queen. Odds 
      chess is a centuries-old tradition and there is no shame in it.
  - for: A large gap in thinking time
    method: >
      Give the weaker player twice the clock. It levels far more 
      precisely than material does.
lineage:
  from:
    - Chaturanga
    - Shatranj
  note: >
    Descends through Persian Shatranj from Indian Chaturanga. The modern 
    queen and bishop moves are a late-fifteenth-century European change 
    that made the game dramatically faster.
misplays:
  - move: >
      Moving the same piece repeatedly in the opening to chase a threat.
    instead: >
      Develop a new piece nearly every move, castle early, and connect 
      the rooks.
  - move: >
      Grabbing a pawn that pulls your queen out of play.
    instead: >
      An early queen raid usually loses time — every developing move 
      your opponent makes comes with a free attack.
opening: >
  Control the centre, develop a knight before a bishop, and castle 
  within the first ten moves. Any opening that does those three 
  things is a good opening at club level.
etiquette: >
  Offer a draw only on your own move, after moving and before 
  pressing the clock. Resigning a lost position is polite; playing 
  on hoping for a blunder is not, past a certain point.
substitutions: >
  A missing piece can be stood in for by a coin or an upturned pawn, agreed
  before the game. A missing queen is traditionally represented by an upturned
  rook.
accessibility: >
  Piece shape carries the information, not colour, so colour vision is rarely a
  barrier — but light-versus-dark squares can be. Tactile sets with pegged
  pieces and raised dark squares exist and are the standard accommodation for
  blind players, who typically use algebraic notation spoken aloud.
sources:
  - https://handbook.fide.com/chapter/E012023
verified: null
