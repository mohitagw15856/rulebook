name: links

# Sources rot. This runs monthly and opens nothing automatically — it just
# fails loudly so the failure lands in the Actions tab.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-links.mjs
