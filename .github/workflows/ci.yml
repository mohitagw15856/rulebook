name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The contributors list is generated from git history, so a shallow
          # clone would produce a different README and fail the staleness check.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install step. This repo has no dependencies.
      - name: Validate every game against the schema
        run: npm run validate

      - name: Check the prose is original
        run: npm run check

      - name: Run the scoring tests
        run: npm test

      - name: Rebuild the generated files
        run: npm run build

      - name: Fail if the generated files are stale
        run: |
          if ! git diff --quiet; then
            echo "::error::README.md or docs/games/ is out of date. Run 'npm run ci' and commit the result."
            git diff --stat
            exit 1
          fi

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The commands from the README must actually work.
      - run: node bin/rulebook.mjs list
      - run: node bin/rulebook.mjs ruling uno "can I stack a draw 2"
      - run: node bin/rulebook.mjs ruling monopoly "free parking"
      - run: node bin/rulebook.mjs score poker "Ah Ad Kc Kh 2s" vs "Qs Qh Qd 7c 3d"
      - run: node bin/rulebook.mjs score gin "4c 5c 6c 7c 9h 9d 9s Kh Kd Ks"
      - run: node bin/rulebook.mjs teach catan
      - run: node bin/rulebook.mjs find --players 6 --minutes 30
      - run: node bin/rulebook.mjs find --players 5 --kids 7
      - run: node bin/rulebook.mjs about backgammon
      - run: node bin/rulebook.mjs night --people 6 --hours 3
      - run: node bin/rulebook.mjs night --people 5 --hours 2 --kids 6
      - run: node bin/rulebook.mjs hottest
      - run: node bin/rulebook.mjs odds catan
      - run: node bin/rulebook.mjs record
      - run: node bin/rulebook.mjs verify
      - run: node bin/rulebook.mjs cheats scrabble
      - run: node bin/rulebook.mjs --lang fr ruling uno "empiler"
      - run: npm run coverage
      - name: The MCP server speaks MCP
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"settle_rules_dispute","arguments":{"game":"uno","question":"stacking"}}}' \
            | node mcp/server.mjs > /tmp/mcp.out
          grep -q '"tools"' /tmp/mcp.out
          grep -q 'NOT AN OFFICIAL RULE' /tmp/mcp.out
          echo "MCP responded on all three calls"
      - name: The JSON API is complete and parseable
        run: |
          npm run build:site
          node -e "
            const fs=require('fs');
            const idx=JSON.parse(fs.readFileSync('site/api/index.json'));
            const all=JSON.parse(fs.readFileSync('site/api/games.json'));
            if (all.length !== idx.counts.games) throw new Error('games.json disagrees with index.json');
            for (const g of all) JSON.parse(fs.readFileSync('site/api/games/'+g.slug+'.json'));
            console.log('API: '+all.length+' games, all parse');
          "
      - name: Print output builds
        run: |
          test -s site/print/index.html
          test -s site/print/deck.html
          grep -q 'ruling cards' site/print/deck.html
      - run: node bin/rulebook.mjs qr uno --ruling stacking-draw-cards
      - name: Reference cards generate for every game
        run: |
          for g in $(node bin/rulebook.mjs list | awk '{print $1}'); do
            node bin/rulebook.mjs card "$g" --out "/tmp/$g.svg" >/dev/null
          done
          echo "generated $(ls /tmp/*.svg | wc -l) reference cards"
      - name: The site build is offline-capable and self-contained
        run: |
          npm run build:site
          test -f site/sw.js
          test -f site/manifest.webmanifest
          test -f site/r/uno/stacking-draw-cards/index.html
          grep -q 'og:description' site/r/uno/stacking-draw-cards/index.html
          # A stray external reference would break the whole offline promise.
          if grep -rE 'src="https?://|@import url\(https?://' site/index.html site/app.js site/style.css; then
            echo "::error::the site must not load anything from another host"
            exit 1
          fi
      - name: A question with no ruling on file must exit non-zero
        run: |
          if node bin/rulebook.mjs ruling uno "how do I fold a paper crane"; then
            echo "::error::an unmatched question should have failed"
            exit 1
          fi
