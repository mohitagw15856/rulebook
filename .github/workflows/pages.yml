name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; a queued run supersedes the one waiting.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install step. The site has no dependencies either — the scoring
      # modules are copied verbatim and loaded as plain ESM by the browser.
      - name: Build the site from the registry
        run: npm run build:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
